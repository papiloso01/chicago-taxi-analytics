name: Tests and pipeline smoke test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: taxi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxi" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://taxi:testpassword@localhost:5432/taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: taxi
      DB_HOST: localhost
      DBT_PROFILES_DIR: ./dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[transform]'
      - run: python -m unittest discover -s tests -v
      - run: taxi-pipeline --sample data/sample/trips.json --start 2024-01-01 --end 2024-01-04
      - run: taxi-pipeline --sample data/sample/trips.json --start 2024-01-01 --end 2024-01-04
      - run: dbt build --project-dir dbt
      - run: python tests/check_database.py
