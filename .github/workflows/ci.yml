name: Layered pipeline checks
jobs:
  postgres_compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: taxi
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U taxi" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      DATABASE_URL: postgresql://taxi:testpassword@localhost:5432/taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: taxi
      DB_HOST: localhost
      DBT_PROFILES_DIR: ./dbt
      JDBC_URL: jdbc:postgresql://localhost:5432/taxi
      PYSPARK_SUBMIT_ARGS: --jars /tmp/postgresql.jar pyspark-shell
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - run: curl -fsSL https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.5/postgresql-42.7.5.jar
        -o /tmp/postgresql.jar
    - run: pip install '.[spark,lake,test]'
    - run: python tests/integration/integration_ingestion.py
    - run: python scripts/run_warehouse.py
    - run: python tests/etl_validation/check_warehouse.py
    - run: 'python scripts/run_warehouse.py

        python tests/etl_validation/check_warehouse.py'
    - name: Enrichment ingestion, joins, export and replay checks
      run: 'python -m taxi_pipeline.enrichment --sample data/sample/enrichment.json
        --start 2024-01-01 --end 2024-01-04

        python -m taxi_pipeline.enrichment --sample data/sample/enrichment.json --start
        2024-01-01 --end 2024-01-04

        python scripts/run_enrichment.py

        python tests/etl_validation/check_enrichment.py

        python scripts/run_enrichment.py

        python tests/etl_validation/check_enrichment.py

        python scripts/export_enrichment.py'
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
        - functional
        - integration
        - etl_validation
        - e2e
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - run: pip install '.[spark,lake,test]'
    - name: Static and metadata checks
      if: matrix.suite == 'functional'
      run: 'python -m ruff check src pipelines tools tests

        python tools/validate_metadata.py

        cfn-lint infrastructure/aws/athena.yml'
    - run: python -m pytest tests/${{ matrix.suite }} -v --junitxml=test-results/${{
        matrix.suite }}.xml
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tests-${{ matrix.suite }}
        path: test-results/
'on':
- push
- pull_request
permissions:
  contents: read
