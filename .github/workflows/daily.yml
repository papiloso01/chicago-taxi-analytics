name: Daily API ingestion and reporting
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date YYYY-MM-DD (blank = 7 days ago)'
        required: false
      end:
        description: 'Exclusive end date (blank = today)'
        required: false
concurrency:
  group: taxi-production-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    if: vars.ENABLE_DAILY_PIPELINE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      START_DATE: ${{ inputs.start }}
      END_DATE: ${{ inputs.end }}
      DBT_PROFILES_DIR: ./dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[transform]'
      - run: taxi-pipeline
      - run: dbt build --project-dir dbt
