name: Daily API ingestion and reporting
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date YYYY-MM-DD (blank = Chicago yesterday)'
        required: false
      end:
        description: 'Exclusive end date (blank = Chicago today)'
        required: false
concurrency:
  group: taxi-production-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    if: vars.ENABLE_DAILY_PIPELINE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      START_DATE: ${{ inputs.start }}
      END_DATE: ${{ inputs.end }}
      JDBC_URL: ${{ secrets.JDBC_URL }}
      PYSPARK_SUBMIT_ARGS: --jars /tmp/postgresql.jar pyspark-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.5/postgresql-42.7.5.jar -o /tmp/postgresql.jar
      - run: pip install '.[spark]'
      - run: taxi-pipeline
      - run: python scripts/run_warehouse.py
