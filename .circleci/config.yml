version: 2.1
jobs:
  functional:
    docker: &id001
    - image: cimg/python:3.11
    environment: &id002
      SPARK_LOCAL_IP: 127.0.0.1
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    resource_class: medium
    steps:
    - checkout
    - &id003
      run:
        name: Install Java and test dependencies
        command: 'sudo apt-get update

          sudo apt-get install -y openjdk-17-jre-headless

          python -m pip install ''.[spark,lake,test]'''
    - run:
        name: Functional
        command: 'python -m ruff check src pipelines tools tests

          python tools/validate_metadata.py

          cfn-lint infrastructure/aws/athena.yml

          python -m pytest tests/functional -v --junitxml=test-results/functional.xml'
    - store_test_results:
        path: test-results
    - store_artifacts:
        path: test-results
        destination: functional
  integration:
    docker: *id001
    environment: *id002
    resource_class: medium
    steps:
    - checkout
    - *id003
    - run:
        name: Integration
        command: python -m pytest tests/integration -v --junitxml=test-results/integration.xml
    - store_test_results:
        path: test-results
    - store_artifacts:
        path: test-results
        destination: integration
  etl_validation:
    docker: *id001
    environment: *id002
    resource_class: medium
    steps:
    - checkout
    - *id003
    - run:
        name: Etl Validation
        command: python -m pytest tests/etl_validation -v --junitxml=test-results/etl_validation.xml
    - store_test_results:
        path: test-results
    - store_artifacts:
        path: test-results
        destination: etl_validation
  e2e:
    docker: *id001
    environment: *id002
    resource_class: medium
    steps:
    - checkout
    - *id003
    - run:
        name: E2E
        command: python -m pytest tests/e2e -v --junitxml=test-results/e2e.xml
    - store_test_results:
        path: test-results
    - store_artifacts:
        path: test-results
        destination: e2e
  postgres_compatibility:
    docker:
    - image: cimg/python:3.11
    - image: postgres:16
      environment:
        POSTGRES_USER: taxi
        POSTGRES_PASSWORD: testpassword
        POSTGRES_DB: taxi
    environment:
      DATABASE_URL: postgresql://taxi:testpassword@localhost:5432/taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: taxi
      DB_HOST: localhost
      DBT_PROFILES_DIR: ./dbt
      JDBC_URL: jdbc:postgresql://localhost:5432/taxi
      PYSPARK_SUBMIT_ARGS: --jars /tmp/postgresql.jar pyspark-shell
      SPARK_LOCAL_IP: 127.0.0.1
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
    - checkout
    - run:
        name: Install Java and PostgreSQL JDBC driver
        command: 'sudo apt-get update

          sudo apt-get install -y openjdk-17-jre-headless

          curl -fsSL https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.5/postgresql-42.7.5.jar
          -o /tmp/postgresql.jar'
    - run:
        name: Install pipeline and PySpark
        command: python -m pip install '.[spark,test]'
    - run:
        name: Wait for PostgreSQL
        command: python scripts/wait_database.py
    - run:
        name: Test ingestion, replay and failure audit
        command: python tests/integration/integration_ingestion.py
    - run:
        name: Transform bronze to silver and gold
        command: python scripts/run_warehouse.py
    - run:
        name: Reconcile all layers and dimension joins
        command: python tests/etl_validation/check_warehouse.py
    - run:
        name: Replay warehouse and verify consistent results
        command: 'python scripts/run_warehouse.py

          python tests/etl_validation/check_warehouse.py'
    - run:
        name: Test weather/community ingestion and enrichment end-to-end
        command: 'python -m taxi_pipeline.enrichment --sample data/sample/enrichment.json
          --start 2024-01-01 --end 2024-01-04

          python -m taxi_pipeline.enrichment --sample data/sample/enrichment.json
          --start 2024-01-01 --end 2024-01-04

          python scripts/run_enrichment.py

          python tests/etl_validation/check_enrichment.py

          python scripts/run_enrichment.py

          python tests/etl_validation/check_enrichment.py

          python scripts/export_enrichment.py'
    - store_artifacts:
        path: data/exports
        destination: synthetic-enrichment-preview
    - store_artifacts:
        path: docs
        destination: warehouse-design
    - store_test_results:
        path: test-results
    - store_artifacts:
        path: test-results
        destination: unit-test-results
    resource_class: medium
workflows:
  validate_platform:
    jobs:
    - functional
    - integration:
        requires:
        - functional
    - etl_validation:
        requires:
        - functional
    - e2e:
        requires:
        - integration
        - etl_validation
    - postgres_compatibility:
        requires:
        - functional
