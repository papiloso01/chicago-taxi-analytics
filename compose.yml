services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-taxi}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  pipeline:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taxi}
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
  dashboard:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taxi}
    command: streamlit run dashboard/app.py --server.address=0.0.0.0
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
