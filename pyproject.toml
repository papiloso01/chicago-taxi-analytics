[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-analytics"
version = "1.0.0"
description = "API-to-dashboard Chicago taxi analytics pipeline"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.2,<3"]
transform = ["dbt-postgres>=1.9,<2"]
spark = ["pyspark==3.5.6"]
test = ["unittest-xml-reporting>=3.2,<4", "pytest>=8,<9", "PyYAML>=6,<7", "moto[s3,glue]>=5,<6", "ruff>=0.11,<1", "cfn-lint>=1,<2"]
lake = ["boto3>=1.35,<2", "PyYAML>=6,<7", "duckdb>=1.2,<2"]

[project.scripts]
taxi-pipeline = "chicago_taxi.ingestion.taxi_trips:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["src/taxi_pipeline", "dbt"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
